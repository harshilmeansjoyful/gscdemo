version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "→ cd into gms-ui"
      - cd gms-ui
      - echo "→ install deps"
      - npm install
      - echo "→ build (creates dist/ or build/)"
      - npm run build
      - echo "→ back to repo root"
      - cd ../..

  build:
    commands:
      - echo "→ prepare output"
      - mkdir -p output
      - echo "→ copy everything from gms-ui → output"
      - cp -r gms-ui/* output/
      - echo "→ copy hook scripts into output/"
      - cp install_dependencies.sh output/       || true
      - cp another_hook.sh      output/       || true

  post_build:
    commands:
      - echo "→ final contents of output/:"
      - ls -R output

artifacts:
  base-directory: output
  files:
    - '**/*'
  discard-paths: no
