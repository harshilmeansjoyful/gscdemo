version: 0.2

env:
  variables:
    UI_DIR: "client"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "→ cd into $UI_DIR"
      - cd $UI_DIR
      - echo "→ install dependencies"
      - npm install

  build:
    commands:
      - echo "→ build (output will go to dist/)"
      - npm run build

  post_build:
    commands:
      - echo "→ back to repo root"
      - cd ..
      - echo "→ dist directory structure:"
      - ls -R $UI_DIR/dist        # <— debug
      - echo "→ prepare output directory"
      - mkdir -p output
      - echo "→ copy everything from dist → output"
      - cp -r $UI_DIR/dist/* output/
      - echo "→ copy hook scripts (if any)"
      - cp scripts/install_dependencies.sh output/     || true
      - cp scripts/another_hook.sh      output/     || true
      - echo "→ final contents of output/:"
      - ls -R output

artifacts:
  base-directory: output
  files:
    - '**/*'
  discard-paths: no
