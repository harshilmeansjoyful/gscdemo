version: 0.2

env:
  variables:
    UI_DIR: "client"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "→ enter $UI_DIR"
      - cd $UI_DIR
      - echo "→ install dependencies"
      - npm install

  build:
    commands:
      - echo "→ build (already in $UI_DIR)"
      - npm run build

  post_build:
    commands:
      - echo "→ back to repo root"
      - cd $CODEBUILD_SRC_DIR
      - echo "→ prepare output directory"
      - mkdir -p output
      - echo "→ copy dist → output"
      - cp -r $UI_DIR/dist/* output/
      - echo "→ include hook scripts"
      - cp scripts/install_dependencies.sh output/ || true
      - cp scripts/another_hook.sh      output/ || true
      - echo "→ final output contents"
      - ls -R output

artifacts:
  base-directory: output
  files:
    - '**/*'
  discard-paths: no
